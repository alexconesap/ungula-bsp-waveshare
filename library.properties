name=UngulaBspWaveshare
version=1.0.0
author=Alex Conesa <alexconesap@gmail.com>
maintainer=Alex Conesa <alexconesap@gmail.com>
sentence=Board support package for Waveshare ESP32-S3 touch LCD development boards.
paragraph=Single owner of the CH422G I/O expander shared by every Waveshare ESP32-S3 LCD board (touch reset, LCD reset, LCD backlight, SD chip-select, USB select). One brand-level library, one board entry-point per model. Currently ships ESP32-S3-Touch-LCD-7 and ESP32-S3-Touch-LCD-4.3 board modules. Pulling in the umbrella header (ungula_bsp_waveshare.h) makes the Arduino CLI discover it; the host project includes the specific board header it actually targets.
category=Device Control
url=https://github.com/alexconesap/ungula-bsp-waveshare.git
includes=ungula_bsp_waveshare.h
depends=UngulaCore,UngulaHal,ESP32_IO_Expander
architectures=esp32
